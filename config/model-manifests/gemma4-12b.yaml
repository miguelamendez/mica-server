references:
- kind: model-card
  title: Gemma 4 12B upstream
  url: https://huggingface.co/google/gemma-4-12B-it
  description: 256K shared total context. No independently verified training-based output ceiling. Text output only;
    audio input is not speech synthesis. Videos are sampled frames, not continuous video embeddings.
- kind: documentation
  title: Gemma 4 12B architecture
  url: https://huggingface.co/google/gemma-4-12B-it/blob/main/config.json
  description: 48 layers; 8 global attention layers and 40 sliding attention layers, with 1024-token local windows.
    Global attention uses tied K/V; allocation optimization must be verified against the engine.
- kind: model-card
  title: Unsloth QAT GGUF and optional MTP
  url: https://huggingface.co/unsloth/gemma-4-12B-it-qat-GGUF
  description: Publisher sampling guidance temperature 1.0, top_p 0.95, top_k 64. Image before text; audio after
    text. Audio up to 30 seconds, video up to 60 sampled frames. MTP is optional and requires separate acceptance
    testing.
