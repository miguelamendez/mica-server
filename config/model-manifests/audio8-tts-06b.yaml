references:
  - kind: model-card
    title: Audio8 packed text and audio capacity
    url: https://huggingface.co/Edge0/Audio8-TTS-Preview-0.6b
    description: Publisher documents up to 2048 packed text/audio positions for the DualAR model, not 2048 words or seconds. Text, voice-reference audio, and generated acoustic frames share this capacity. Exact training lengths and a general output-duration ceiling were not verified in the 2026-10-07 audit. Audio8's former repository URL redirects to Edge0.
  - kind: documentation
    title: Audio8 architecture configuration
    url: https://huggingface.co/Edge0/Audio8-TTS-Preview-0.6b/blob/main/config.json
    description: max_seq_len is 2048. The 512 max_new_tokens generation default is not a trained or hard output limit and acoustic tokens are not LLM response-text tokens.
