license: apache-2.0
references:
  - kind: paper
    title: "GSQ: Highly-Accurate Low-Precision Scalar Quantization for LLMs via Gumbel-Softmax Sampling"
    url: https://arxiv.org/abs/2604.18556
    description: Calibration-based refinement of discrete weight assignments and group scales.
  - kind: code
    title: GSQ reference implementation
    url: https://github.com/IST-DASLab/GSQ
    description: Apache-2.0 source, quantization configurations, and calibration/optimization tooling.
  - kind: paper
    title: Model Compression with Exact Budget Constraints via Riemannian Manifolds
    url: https://arxiv.org/abs/2605.00649
    description: RCO mixed-precision allocation under a model-size budget.
  - kind: code
    title: RCO reference implementation
    url: https://github.com/IST-DASLab/RCO
    description: Apache-2.0 source for budget-constrained precision allocation and MoE expert pruning.
  - kind: model-card
    title: Qwen3.8 27B GSQ-RCO release and reported evaluations
    url: https://huggingface.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF/blob/d562806dbafae37109975e970aae91b43e73b440/README.md
    description: Publisher methodology and benchmarks; not Mica's local validation results.
  - kind: reproducibility
    title: IQ3_XXS per-tensor precision allocation
    url: https://huggingface.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF/blob/d562806dbafae37109975e970aae91b43e73b440/tensor-allocation/Qwen3.8-27B-GSQ-RCO-IQ3_XXS.rco-allocation.txt
    description: Precision assigned to each tensor in the registered IQ3_XXS artifact.
  - kind: reproducibility
    title: Qwen3.8 27B calibration importance matrix
    url: https://huggingface.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF/blob/d562806dbafae37109975e970aae91b43e73b440/imatrix-qwen3.8-27b.gguf
    description: Publisher-provided importance matrix; not the raw calibration dataset.
  - kind: model-card
    title: Pinned BF16 vision projector
    url: https://huggingface.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF/blob/d562806dbafae37109975e970aae91b43e73b440/mmproj-Qwen3.8-27B-BF16.gguf
    description: Separate mmproj file included in this bundle; not embedded in the target GGUF.
  - kind: model-card
    title: Pinned DFlash2 Q4_K_M drafter
    url: https://huggingface.co/z-lab/Qwen3.8-27B-DFlash2-GGUF/blob/2d9571f8ce46e151f61c6499c99dee6079e1d610/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
    description: External text-only drafter used by qwen38-27b-text-dflash; not downloaded by this bundle. An alternative to MTP, not stacked with it.
  - kind: model-card
    title: Pinned external Q4_0 MTP head
    url: https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/blob/4ca720788d1e01f1bff70c033e0d0028fd02e502/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
    description: External one-layer prediction head used by qwen38-27b-vision-mtp; not downloaded by this bundle. The target IQ3_XXS GGUF contains no embedded MTP head.
  - kind: documentation
    title: Qwen3.8 base architecture context
    url: https://huggingface.co/Qwen/Qwen3.8-27B/blob/main/config.json
    description: Base text_config.max_position_embeddings is 262144; this is architecture capacity, not a disclosed training sequence length or a memory-fit guarantee after quantization.
  - kind: model-card
    title: Qwen3.8 context and generation guidance
    url: https://huggingface.co/Qwen/Qwen3.8-27B
    description: Publisher's large output guidance requires 1M extended context. Training lengths, separate native recommendations, and independent output ceilings remain unverified (2026-10-07).
