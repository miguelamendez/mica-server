references:
  - kind: model-card
    title: Qwen3.5 9B upstream model card
    url: https://huggingface.co/Qwen/Qwen3.5-9B
    description: Native total context is 262144 including input and output. Publisher recommends 32768 generated tokens for most queries; this is not a supported or trained-output ceiling. Exact training lengths and a separate recommended total window were not verified in the 2026-10-07 audit. enable_thinking controls thinking per request.
  - kind: documentation
    title: Qwen3.5 9B architecture configuration
    url: https://huggingface.co/Qwen/Qwen3.5-9B/blob/main/config.json
    description: Eight full-attention layers with four KV heads of width 256 imply 32768 bytes of F16 K/V per token. Recurrent state, vision processing, and workspace are covered by the separate conservative base reservation.
  - kind: model-card
    title: Unsloth pinned Qwen3.5 9B GGUF release
    url: https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/blob/3885219b6810b007914f3a7950a8d1b469d598a5/README.md
    description: Published Q4_K_M and BF16 projector; Mica downloads these existing artifacts rather than requantizing.
  - kind: documentation
    title: llama.cpp Qwen vision preprocessing discussion
    url: https://github.com/ggml-org/llama.cpp/issues/16842
    description: Native Qwen vision loader recommends a minimum 1024 image tokens when grounding accuracy is poor. The registered token floor increases visual preprocessing, not text context or output limits.
