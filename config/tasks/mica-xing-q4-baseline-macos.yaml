schema: 4
id: mica-xing-q4-baseline-macos
description: Experimental Xing IQ4_NL baseline for 24 GiB Apple Silicon; 20 GiB admission budget is not a physical memory hard cap.
default_chat_model: xing4-29b-a4b
mode: evaluation
memory:
  required_ram_gib: 20
  maximum_resident_workers: 1
  required_vram_gib: 0
  safety_reserve_gib: 0.5
models:
  - artifact:
      id: q4
    batching:
      max_concurrent_requests: 1
    context:
      max_input_tokens: 2048
      max_output_tokens: 512
      max_total_tokens: 2560
    engine: xing-llama-cpp
    id: xing4-29b-a4b
    idle_seconds: 120
    kv_cache:
      precision: q8
    placement:
      device: metal:0
      gpu_layers: 99
      mode: fixed
    priority: 100
    residency: warm
    startup: true
