schema: 2
id: mlx-audio
description: Apple Silicon MLX speech recognition and speech synthesis for supported audio models, using the shared MLX Python environment.
status: current
backend: mlx
installer: python-mlx
launcher: mlx-audio
device_target: mlx
hardware: [apple-silicon]
artifact_formats: [mlx]
compatibility_tags: [asr, tts]
endpoint_contracts:
  - {id: transcribe, operation: audio.transcribe, transport: http, adapter_call: openai_audio_transcriptions, method: POST, path: /v1/audio/transcriptions, required_inputs: [audio], outputs: [text]}
  - {id: speech, operation: audio.synthesize_speech, transport: http, adapter_call: openai_audio_speech, method: POST, path: /v1/audio/speech, required_inputs: [text], optional_inputs: [audio], outputs: [audio], streaming: true}
install:
  environment_group: mlx
  python_packages: ["mlx-audio[all,server]>=0.5.1"]
