schema: 2
id: llama-cpp
description: Native llama.cpp HTTP inference for compatible GGUF text, vision, audio-understanding and embedding models. Builds for the detected CPU or accelerator.
status: current
backend: gguf
installer: cmake-llama
launcher: llama-server
device_target: gguf
hardware: [cpu, metal, cuda, rocm, sycl, vulkan]
artifact_formats: [gguf]
compatibility_tags: [text-generation, vision-projector, speculative-mtp, speculative-dflash]
endpoint_contracts:
  - {id: chat, operation: chat.generate, transport: http, adapter_call: openai_chat, method: POST, path: /v1/chat/completions, required_inputs: [text], optional_inputs: [image, video, audio], outputs: [text], streaming: true, supports_tools: true}
  - {id: embeddings, operation: embedding.generate, transport: http, adapter_call: openai_embeddings, method: POST, path: /v1/embeddings, required_inputs: [text], optional_inputs: [image, video, audio], outputs: [embedding], streaming: false}
  - {id: completion, operation: text.generate, transport: http, adapter_call: mica_completion_adapter, method: POST, path: /v1/chat/completions, required_inputs: [text], outputs: [text], streaming: true}
source:
  url: https://github.com/ggml-org/llama.cpp.git
  revision: latest
install:
  runtime_directory: llama.cpp
  server_executable: build-mica/bin/llama-server
  quantizer_executable: build-mica/bin/llama-quantize
  build_targets: [llama-server, llama-quantize]
  version_arguments: [--version]
  cmake_definitions:
    common: {CMAKE_BUILD_TYPE: Release, GGML_NATIVE: ON}
    cpu: {}
    metal: {GGML_METAL: ON}
    cuda: {GGML_CUDA: ON}
    rocm: {GGML_HIP: ON}
    sycl: {GGML_SYCL: ON}
    vulkan: {GGML_VULKAN: ON}
