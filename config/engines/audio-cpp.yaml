schema: 2
id: audio-cpp
status: current
backend: gguf
installer: cmake-audio
launcher: audio-server
device_target: audio
hardware: [cpu, metal, cuda, rocm, vulkan]
artifact_formats: [gguf]
compatibility_tags: [asr, tts, speaker-diarization]
endpoint_contracts:
  - {id: diarize, operation: audio.diarize, transport: http, adapter_call: audio_diarization, method: POST, path: /v1/audio/transcriptions/details, required_inputs: [audio], outputs: [text], streaming: false}
  - {id: transcribe, operation: audio.transcribe, transport: http, adapter_call: openai_audio_transcriptions, method: POST, path: /v1/audio/transcriptions, required_inputs: [audio], outputs: [text]}
  - {id: speech, operation: audio.synthesize_speech, transport: http, adapter_call: openai_audio_speech, method: POST, path: /v1/audio/speech, required_inputs: [text], optional_inputs: [audio], outputs: [audio], streaming: true}
source:
  url: https://github.com/0xShug0/audio.cpp.git
  revision: latest
install:
  runtime_directory: audio.cpp
  server_executable: build-mica/bin/audiocpp_server
  quantizer_executable: build-mica/bin/audiocpp_gguf
  build_targets: [audiocpp_server, audiocpp_gguf]
  version_arguments: [--help]
  cmake_definitions:
    common: {CMAKE_BUILD_TYPE: Release, AUDIOCPP_MODEL_SET: custom}
    cpu: {}
    metal: {ENGINE_ENABLE_METAL: ON}
    cuda: {ENGINE_ENABLE_CUDA: ON}
    rocm: {ENGINE_ENABLE_HIP: ON}
    vulkan: {ENGINE_ENABLE_VULKAN: ON}
