schema: 2
id: vllm
description: Python vLLM serving for compatible models and accelerator targets. Engine compatibility is separate from hardware-specific installation and inference certification.
status: current
backend: vllm
installer: python-vllm
launcher: vllm
device_target: vllm
hardware: [cpu, cuda, rocm, xpu, tpu, metal]
artifact_formats: [safetensors, compressed-tensors, mlx]
compatibility_tags: [text-generation]
endpoint_contracts:
  - {id: chat, operation: chat.generate, transport: http, adapter_call: openai_chat, method: POST, path: /v1/chat/completions, required_inputs: [text], outputs: [text], streaming: true}
  - {id: completion, operation: text.generate, transport: http, adapter_call: mica_completion_adapter, method: POST, path: /v1/chat/completions, required_inputs: [text], outputs: [text], streaming: true}
install:
  environment_group: vllm
