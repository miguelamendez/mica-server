schema: 5
id: mica-coder-bonsai-macos
description: Apple Silicon coding workspace with Bonsai as primary coder, Ling and Spark as alternate text models, and MiniCPM for image or PDF-page analysis.
selection:
  engine_policy: explicit-only
  defaults:
    - {operation: chat.generate, required_inputs: [text], model: ternary-bonsai-2-27b}
    - {operation: chat.generate, required_inputs: [text, image], model: minicpm-v46-thinking}
    - {operation: chat.generate, required_inputs: [text, video], model: minicpm-v46-thinking}
mode: coding
memory:
  required_ram_gib: 16
  maximum_resident_workers: 1
  required_vram_gib: 0
  safety_reserve_gib: 0.5
models:
  - artifact:
      id: pq2_0
    batching:
      max_concurrent_requests: 1
    context:
      max_input_tokens: 6144
      max_output_tokens: 2048
      max_total_tokens: 8192
    engine: prism-llama-cpp
    id: ternary-bonsai-2-27b
    idle_seconds: 120
    kv_cache:
      precision: q8
    placement:
      device: metal:0
      gpu_layers: 99
      mode: fixed
    priority: 100
    residency: warm
    startup: true
  - artifact:
      id: q4
    batching:
      max_concurrent_requests: 1
    context:
      max_input_tokens: 7168
      max_output_tokens: 1024
      max_total_tokens: 8192
    engine: mlx-lm
    id: spark-x25-4b
    idle_seconds: 120
    kv_cache:
      precision: q8
    placement:
      device: metal:0
      mode: fixed
    priority: 80
    residency: on-demand
    startup: false
  - artifact:
      id: q4
    batching:
      max_concurrent_requests: 1
    context:
      max_input_tokens: 7168
      max_output_tokens: 1024
      max_total_tokens: 8192
    engine: llama-cpp
    id: ling-3-tiny
    idle_seconds: 120
    kv_cache:
      precision: q8
    placement:
      device: metal:0
      gpu_layers: 99
      mode: fixed
    priority: 75
    residency: on-demand
    startup: false
  - artifact:
      id: q4
    batching:
      max_concurrent_requests: 1
    context:
      max_input_tokens: 6144
      max_output_tokens: 2048
      max_total_tokens: 8192
    engine: mlx-vlm
    id: minicpm-v46-thinking
    idle_seconds: 60
    kv_cache:
      precision: q4
    placement:
      device: metal:0
      mode: fixed
    priority: 70
    residency: on-demand
    startup: false
