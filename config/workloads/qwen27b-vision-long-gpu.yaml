schema: 5
id: qwen27b-vision-long-gpu
description: Experimental GPU-only Qwen 27B vision baseline with 160K input plus 32K output reservation. No drafter; target, KV cache and projector on CUDA. A requested window is not a certification that populated context fits or preserves quality.
selection:
  defaults:
    - {operation: chat.generate, required_inputs: [text, image], model: qwen38-27b-gsq-rco}
mode: coding
memory: {required_ram_gib: 16, required_vram_gib: 15.5, maximum_resident_workers: 1, safety_reserve_gib: 0.5}
models:
  - id: qwen38-27b-gsq-rco
    artifact: {id: iq3_xxs}
    context: {max_input_tokens: 163840, max_output_tokens: 32768, max_total_tokens: 196608}
    batching: {max_concurrent_requests: 1, token_batch_size: 512, micro_batch_size: 128}
    kv_cache: {precision: q4, context_checkpoints: 2, ram_cache_mib: 0}
    speculative: {method: none}
    placement: {device: 'cuda:0', mode: fixed, gpu_layers: 99, ram_reservation_gib: 12}
    priority: 100
    residency: warm
    startup: true
    idle_seconds: 120
