schema: 5
id: qwen27b-modes
catalog_visible: false
description: RTX 16 GiB Qwen 27B modes, one worker at a time. Text-only DFlash has 80K input plus 32K output; vision uses a GPU projector and MTP with 48K input plus 16K output. Q4 KV, single request. Input/output limits include framing and media tokens, not just user text.
selection:
  defaults:
    - {operation: chat.generate, required_inputs: [text], model: qwen38-27b-text-dflash}
    - {operation: chat.generate, required_inputs: [text, image], model: qwen38-27b-vision-mtp}
mode: coding
memory: {required_ram_gib: 16, required_vram_gib: 15.5, maximum_resident_workers: 1, safety_reserve_gib: 0.5}
models:
  - id: qwen38-27b-text-dflash
    artifact: {id: iq3_xxs}
    context: {max_input_tokens: 81920, max_output_tokens: 32768, max_total_tokens: 114688}
    batching: {max_concurrent_requests: 1, token_batch_size: 512, micro_batch_size: 128}
    kv_cache: {precision: q4, context_checkpoints: 2, ram_cache_mib: 0}
    speculative: {method: dflash, max_draft_tokens: 7, gpu_layers: 99, kv_cache_precision: q4}
    placement: {device: 'cuda:0', mode: fixed, gpu_layers: 99, ram_reservation_gib: 12}
    priority: 100
    residency: warm
    startup: true
    idle_seconds: 120
  - id: qwen38-27b-vision-mtp
    artifact: {id: iq3_xxs}
    context: {max_input_tokens: 49152, max_output_tokens: 16384, max_total_tokens: 65536}
    batching: {max_concurrent_requests: 1, token_batch_size: 512, micro_batch_size: 128}
    kv_cache: {precision: q4, context_checkpoints: 2, ram_cache_mib: 0}
    speculative: {method: mtp, max_draft_tokens: 7, gpu_layers: 99, kv_cache_precision: q4}
    placement: {device: 'cuda:0', mode: fixed, gpu_layers: 99, ram_reservation_gib: 12}
    priority: 90
    residency: on-demand
    startup: false
    idle_seconds: 120
