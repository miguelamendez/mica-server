schema: 5
id: mac_visual_extraction
description: Apple Silicon image/video and rendered-document extraction with MiniCPM Q8 as default, Qwen3.5 4B Q4 as an alternate and Qwen3.5 9B Q4 as the larger slower quality-oriented option. Select the model explicitly for comparisons; one resident worker. No ASR or TTS.
catalog_visible: true
selection:
  engine_policy: explicit-only
  defaults:
    - {operation: chat.generate, required_inputs: [text], model: minicpm-v46-thinking}
    - {operation: chat.generate, required_inputs: [text, image], model: minicpm-v46-thinking}
    - {operation: chat.generate, required_inputs: [text, video], model: minicpm-v46-thinking}
mode: visual-extraction
memory: {required_ram_gib: 14, required_vram_gib: 0, maximum_resident_workers: 1, safety_reserve_gib: 0.5}
models:
  - id: minicpm-v46-thinking
    engine: mlx-vlm
    artifact: {id: q8}
    context: {max_input_tokens: 65536, max_output_tokens: 16384, max_total_tokens: 81920}
    batching: {max_concurrent_requests: 1}
    kv_cache: {precision: q8}
    placement: {device: 'metal:0', mode: fixed}
    priority: 100
    residency: warm
    startup: true
    idle_seconds: 120
  - id: qwen35-4b
    engine: llama-cpp
    artifact: {id: q4}
    context: {max_input_tokens: 65536, max_output_tokens: 16384, max_total_tokens: 81920}
    batching: {max_concurrent_requests: 1}
    kv_cache: {precision: q8}
    placement: {device: 'metal:0', mode: fixed, gpu_layers: 99}
    priority: 90
    residency: on-demand
    startup: false
    idle_seconds: 120
  - id: qwen35-9b
    engine: llama-cpp
    artifact: {id: q4}
    context: {max_input_tokens: 65536, max_output_tokens: 16384, max_total_tokens: 81920}
    batching: {max_concurrent_requests: 1}
    kv_cache: {precision: q8}
    placement: {device: 'metal:0', mode: fixed, gpu_layers: 99}
    priority: 80
    residency: on-demand
    startup: false
    idle_seconds: 120
