schema: 5
id: mica-assistant-mlx
catalog_visible: false
description: General Apple Silicon MLX assistant combining text chat, visual understanding, speech recognition, and speech replies.
selection:
  engine_policy: explicit-only
  defaults:
    - {operation: chat.generate, required_inputs: [text], model: spark-x25-4b}
    - {operation: chat.generate, required_inputs: [text, image], model: minicpm-v46-thinking}
    - {operation: chat.generate, required_inputs: [text, video], model: minicpm-v46-thinking}
    - {operation: audio.transcribe, required_inputs: [audio], model: granite-speech-5}
    - {operation: audio.synthesize_speech, required_inputs: [text], model: audio8-tts-06b}
mode: interactive
memory:
  required_ram_gib: 8
  maximum_resident_workers: 0
  required_vram_gib: 0
  safety_reserve_gib: 0.5
models:
  - artifact:
      id: q4
    batching:
      max_concurrent_requests: 1
    context:
      max_input_tokens: 7168
      max_output_tokens: 1024
      max_total_tokens: 8192
    engine: mlx-lm
    id: spark-x25-4b
    idle_seconds: 0
    kv_cache:
      precision: q8
    placement:
      device: auto
      mode: auto
    priority: 100
    residency: pinned
    startup: true
  - artifact:
      id: q4
    batching:
      max_concurrent_requests: 1
    context:
      max_input_tokens: 1
      max_output_tokens: 1
