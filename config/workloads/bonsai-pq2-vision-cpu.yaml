schema: 5
id: bonsai-pq2-vision-cpu
catalog_visible: false
description: CPU-only Bonsai PQ2 vision validation profile for checking image input without GPU offload.
mode: vision-cpu-validation
memory:
  required_ram_gib: 16
  maximum_resident_workers: 0
  required_vram_gib: 0
  safety_reserve_gib: 0.5
models:
  - artifact:
      id: pq2_0
    batching:
      max_concurrent_requests: 1
    context:
      max_input_tokens: 6144
      max_output_tokens: 2048
      max_total_tokens: 8192
    engine: prism-llama-cpp
    id: ternary-bonsai-2-27b
    idle_seconds: 30
    kv_cache:
      precision: q8
    placement:
      device: cpu
      gpu_layers: 0
      mode: fixed
    priority: 100
    residency: on-demand
    startup: false
