schema: 5
id: mica-coder-qwen-gguf
catalog_visible: false
description: Single-engine coding workspace with Spark Q4 as default, Qwen3.8 27B GSQ-RCO IQ3_XXS as alternate coder, and Qwen3.5 9B Q4 for images and video. One resident worker keeps GPU usage bounded.
selection:
  engine_policy: explicit-only
  defaults:
    - {operation: chat.generate, required_inputs: [text], model: spark-x25-4b}
    - {operation: chat.generate, required_inputs: [text, image], model: qwen35-9b}
    - {operation: chat.generate, required_inputs: [text, video], model: qwen35-9b}
mode: coding
memory:
  required_ram_gib: 16
  required_vram_gib: 0
  maximum_resident_workers: 1
  safety_reserve_gib: 0.5
models:
  - id: spark-x25-4b
    engine: llama-cpp
    artifact: {id: q4}
    context: {max_input_tokens: 65536, max_output_tokens: 16384, max_total_tokens: 81920}
    batching: {max_concurrent_requests: 1}
    kv_cache: {precision: q8}
    placement: {device: auto, mode: auto, gpu_layers: 99}
    priority: 110
    residency: warm
    startup: true
    idle_seconds: 120
  - id: qwen38-27b-gsq-rco
    engine: llama-cpp
    artifact: {id: iq3_xxs}
    context: {max_input_tokens: 65536, max_output_tokens: 16384, max_total_tokens: 81920}
    batching: {max_concurrent_requests: 1}
    kv_cache: {precision: q4}
    placement: {device: auto, mode: auto, gpu_layers: 99}
    priority: 90
    residency: on-demand
    startup: false
    idle_seconds: 120
  - id: qwen35-9b
    engine: llama-cpp
    artifact: {id: q4}
    context: {max_input_tokens: 65536, max_output_tokens: 16384, max_total_tokens: 81920}
    batching: {max_concurrent_requests: 1}
    kv_cache: {precision: q8}
    placement: {device: auto, mode: auto, gpu_layers: 99}
    priority: 70
    residency: on-demand
    startup: false
    idle_seconds: 120
