schema: 5
id: local-researcher-gguf
description: Local multimodal research with Gemma 4 12B QAT for analysis and EmbeddingGemma 2 Q8 for retrieval. Sequential native llama.cpp workers; no Python required. Initial 4K generation context, 8K embedding input ceiling, optional MTP disabled pending validation.
selection:
  engine_policy: prefer-installed
  defaults:
    - {operation: chat.generate, required_inputs: [text], model: gemma4-12b}
    - {operation: chat.generate, required_inputs: [text, image], model: gemma4-12b}
    - {operation: chat.generate, required_inputs: [text, video], model: gemma4-12b}
    - {operation: embedding.generate, required_inputs: [text], model: embeddinggemma-2}
memory:
  strategy: sequential
  limit_gib: 14
  safety_reserve_gib: 0.5
models:
  - id: gemma4-12b
    artifact: {id: q4}
    context: {max_input_tokens: 3072, max_output_tokens: 1024, max_total_tokens: 4096}
    batching: {max_concurrent_requests: 1, token_batch_size: 1024, micro_batch_size: 1024}
    kv_cache: {precision: q8}
    speculative: {method: none}
    placement: {device: auto, mode: auto}
    priority: 100
    residency: warm
    startup: true
    idle_seconds: 300
  - id: embeddinggemma-2
    artifact: {id: q8}
    context: {max_input_tokens: 8192, max_output_tokens: 0, max_total_tokens: 8192}
    batching: {max_concurrent_requests: 1, token_batch_size: 8192, micro_batch_size: 8192}
    kv_cache: {precision: not-applicable}
    speculative: {method: none}
    placement: {device: auto, mode: auto}
    priority: 90
    residency: on-demand
    startup: false
    idle_seconds: 300
