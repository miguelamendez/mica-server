schema: 1
id: mica-assistant
name: Local Assistant
description: Browser chat with streamed text, media, optional voice, and conversation
  archives.
version: 0.3.0
interfaces:
- web
- mcp
source:
  repository: https://github.com/miguelamendez/mica-server
  path: apps/assistant
distribution:
  format: files
  files:
  - path: README.md
    sha256: 476d474f99af8f22bb97035e7c263f3c301471cd40aa93cafa9d43690ea436ad
    size_bytes: 1349
  - path: app.py
    sha256: dc722445ad34e1abe41fab38b0b9d64d34ae8d79049934fdae5b440ea7cd5b36
    size_bytes: 158
