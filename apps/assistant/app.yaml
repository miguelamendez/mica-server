schema: 1
id: mica-assistant
name: Local Assistant
description: Browser chat with streamed text, media, optional voice, and conversation
  archives.
version: 0.2.0
interfaces:
- web
- mcp
source:
  repository: https://github.com/miguelamendez/mica-server
  path: apps/assistant
distribution:
  format: files
  files:
  - path: README.md
    sha256: f5f1cf8121938ba0d40fb10a1a7b629ac32481d2db51f4ebf6519788f4a8efb2
    size_bytes: 1193
  - path: app.py
    sha256: dc722445ad34e1abe41fab38b0b9d64d34ae8d79049934fdae5b440ea7cd5b36
    size_bytes: 158
  - path: mcp.py
    sha256: a2bcf97458a5f9815a16d9c95e7062234f472c7d280e484e8e642a7188787494
    size_bytes: 92
  - path: runtime/mcp_runtime.py
    sha256: 10eb668885d0477cab3289e7f6cf883fff28abc731a497e5ea94d6348d1ac4b9
    size_bytes: 11863
  - path: runtime/mica-capabilities.js
    sha256: c20c42541bb5a7702e044d6a212ea58253a13c7f4da124515baabfd7469ab672
    size_bytes: 1889
  - path: runtime/mica-chat-settings.js
    sha256: c7c51da20f073d3ee4df0fa179ac1da61db4f9ea1fe16372fc0f1a329ebf0079
    size_bytes: 4143
  - path: runtime/mica-logo.svg
    sha256: 892548b91ddbb38d19b53826f4c579a52cd7d5a887fb698a3d279c7d4cdfb44e
