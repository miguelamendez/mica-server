    sha256: 2696b73e05c05936ae5d5865555c36206c24d3e4fa7ccc83dc88c797d6d405be
    size_bytes: 94471
  - path: workloads/cuda.yaml
    sha256: f271454acc2d5f6e1eb02b801e15571573a7e594eea7f1144323a5df9df92474
    size_bytes: 2462
  - path: workloads/mac.yaml
    sha256: 2fd2d0df052eed05abc41eb0b2fb5bfe7c952d69fbb8d5d8b21053aa3ea9bbff
    size_bytes: 2390
requirements:
  operations:
  - chat.generate
permissions:
- microphone
- clipboard
- files
launch:
  executable: python3
  arguments:
  - '{app_dir}/app.py'
  - --config
  - '{mica_config}'
  - --port
  - '{port}'
  - --workload
  - '{workload}'
  - --host
  - 127.0.0.1
  port: 8090
  path: /chat
workloads:
- id: mac
  file: workloads/mac.yaml
  description: Apple Silicon default using compatible MLX engines.
- id: cuda
  file: workloads/cuda.yaml
  description: NVIDIA GPU default with native GGUF engines; audio utilities use CPU.
