    sha256: a2bcf97458a5f9815a16d9c95e7062234f472c7d280e484e8e642a7188787494
    size_bytes: 92
  - path: runtime/mcp_runtime.py
    sha256: 8a49cca4cb9a455d851fd68f58935ab4f3834217bda67d34987b7bd44385fcad
    size_bytes: 11864
  - path: runtime/mica-capabilities.js
    sha256: c20c42541bb5a7702e044d6a212ea58253a13c7f4da124515baabfd7469ab672
    size_bytes: 1889
  - path: runtime/mica-chat-settings.js
    sha256: c7c51da20f073d3ee4df0fa179ac1da61db4f9ea1fe16372fc0f1a329ebf0079
