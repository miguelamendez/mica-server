schema: 5
id: cuda_dictation
description: CUDA dictation with Spark cleanup and CPU Granite ASR; no vision, speech synthesis, or speaker diarization.
catalog_visible: true
selection:
  engine_policy: explicit-only
  defaults:
    - {operation: chat.generate, required_inputs: [text], model: spark-x25-4b}
    - {operation: audio.transcribe, required_inputs: [audio], model: granite-speech-5}
mode: assistant
memory: {required_ram_gib: 8, required_vram_gib: 4, maximum_resident_workers: 0, safety_reserve_gib: 0.5}
models:
  - id: spark-x25-4b
    engine: llama-cpp
    artifact: {id: q4}
    context: {max_input_tokens: 4096, max_output_tokens: 2048, max_total_tokens: 6144}
    batching: {max_concurrent_requests: 1}
    kv_cache: {precision: q8}
    placement: {device: 'cuda:0', mode: fixed, gpu_layers: 99}
    priority: 100
    residency: warm
    startup: true
    idle_seconds: 120
  - id: granite-speech-5
    engine: audio-cpp
    artifact: {id: q8}
    context: {max_input_tokens: 1, max_output_tokens: 1, max_total_tokens: 2}
    batching: {max_concurrent_requests: 1}
    kv_cache: {precision: not-applicable}
    placement: {device: 'cpu', mode: fixed, gpu_layers: 0}
    priority: 90
    residency: warm
    startup: true
    idle_seconds: 120
