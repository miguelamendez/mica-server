requirements:
  operations:
  - audio.transcribe
permissions:
- microphone
- clipboard
- accessibility
- global-hotkeys
- network
launch:
  executable: python3
  arguments:
  - '{app_dir}/app.py'
  - --desktop
  - --config
  - '{mica_config}'
  - --workload
  - '{workload}'
  tui_arguments:
  - '{app_dir}/app.py'
  - --desktop
  - --tui
  - --root
  - '{mica_root}'
  - --connection
  - '{connection}'
  - --config
  - '{mica_config}'
  - --workload
  - '{workload}'
workloads:
- id: mac
  file: workloads/mac.yaml
  description: Apple Silicon default using compatible MLX engines.
- id: cuda
  file: workloads/cuda.yaml
  description: NVIDIA GPU default with native GGUF engines; audio utilities use CPU.
