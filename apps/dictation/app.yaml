schema: 1
id: mica-dictation
name: Dictation
description: Native WhisperFlow-style dictation client with a small connection TUI,
  microphone recording, a global desktop shortcut, ASR, optional LLM cleanup and clipboard
  delivery. macOS can paste into the original focused app; Linux desktop support varies.
  Local or remote inference and a separate MCP interface.
version: 0.2.1
interfaces:
- cli
- tui
- background
- mcp
